<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <svg class="logo" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="5" fill="#89b4fa"/>
          <path d="M7 12h10M12 7v10" stroke="#1e1e2e" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span class="status-dot" id="status-dot"></span>
        <span class="status-text" id="status-text">Inactive</span>
      </div>
      <div class="header-right">
        <span class="version" id="version-text">v1.0</span>
      </div>
    </div>

    <div class="url-row" id="url-display">No tab active</div>

    <div id="error-panel" class="error-panel hidden">
      <span id="error-text"></span>
    </div>

    <div id="cmd-log-panel" class="cmd-log-panel hidden">
      <div class="cmd-log-header">
        <span>Recent commands</span>
        <span id="cmd-count" class="cmd-count">0</span>
      </div>
      <ul id="cmd-log-list" class="cmd-log-list"></ul>
    </div>

    <div class="button-row">
      <button id="activate-btn" class="btn btn-primary">Activate Tab</button>
      <button id="disconnect-btn" class="btn btn-secondary hidden">Disconnect</button>
      <button id="refresh-btn" class="btn btn-secondary hidden">Refresh Snapshot</button>
      <!-- Fix #13: cancel button for pending commands — calls DELETE /command/:cmdId -->
      <button id="cancel-btn" class="btn btn-ghost hidden">Cancel</button>
    </div>

    <p id="info-text" class="info-text">Click "Activate Tab" to give Hermes Agent access to your current page.</p>

    <div id="hermes-session-hint" class="hermes-session-hint hidden"></div>

    <!-- F12: Proxy port override — click to change. Stored in chrome.storage.local. -->
    <div class="footer">
      <a id="dashboard-link" href="http://localhost:9321/dashboard" class="dashboard-link" title="Open Dashboard">Dashboard</a>
      <span class="footer-sep">•</span>
      <!-- F12: Clicking the port number opens an inline input to override proxy host:port -->
      <span id="proxy-port-display" class="port-display" title="Click to change proxy port">localhost:<span id="port-num">9321</span></span>
      <span class="footer-sep">•</span>
      <!-- F24: Shortcut hints in footer -->
      <span id="shortcuts-hint" class="shortcuts-hint" title="Keyboard shortcuts: Ctrl+Shift+R=Refresh, Ctrl+Shift+C=Cancel, Ctrl+Shift+H=Activate">⌘⇧R: Refresh</span>
    </div>
    <!-- F12: Hidden port override input — revealed when user clicks the port display -->
    <div id="port-override-panel" class="port-override hidden">
      <input id="port-override-input" type="text" class="port-input" placeholder="9321" maxlength="5" />
      <button id="port-override-ok" class="btn btn-sm">OK</button>
      <button id="port-override-cancel" class="btn btn-sm btn-ghost">Cancel</button>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
