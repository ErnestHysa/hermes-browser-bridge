<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hermes Browser Bridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="5" fill="#89b4fa"/>
          <path d="M7 12h10M12 7v10" stroke="#1e1e2e" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="title">Hermes Browser Bridge</div>
    </header>

    <div id="status-panel" class="panel">
      <div class="status-row">
        <!-- Fix #17: CSS-only status dot (no emoji) -->
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Inactive</span>
      </div>
      <div class="url-row" id="url-display">No tab active</div>
      <!-- S6: Show Hermes session ID for debugging -->
      <div class="hermes-session-hint" id="hermes-session-hint" style="display:none; font-size:10px; color:#666; margin-top:4px; word-break:break-all;"></div>
    </div>

    <div id="error-panel" class="panel error hidden">
      <span id="error-text"></span>
    </div>

    <!-- Fix #13: command log panel -->
    <div id="cmd-log-panel" class="panel cmd-log hidden">
      <div class="cmd-log-header">
        <span>Recent commands</span>
        <span id="cmd-count">0</span>
      </div>
      <ul id="cmd-log-list"></ul>
    </div>

    <button id="activate-btn" class="btn primary">
      Activate Tab
    </button>

    <button id="disconnect-btn" class="btn secondary hidden">
      Disconnect
    </button>

    <!-- Fix #12: manual refresh button -->
    <button id="refresh-btn" class="btn secondary hidden">
      Refresh Snapshot
    </button>

    <div class="info">
      <p id="info-text">Click "Activate Tab" to give Hermes Agent access to your current page.</p>
    </div>

    <div class="footer">
      <span id="version-text">v1.0</span>
      <span>·</span>
      <span>localhost:9321</span>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
