/tmp/hermes-browser-bridge.log {
    weekly
    rotate 4
    maxsize 10M
    copytruncate
    missingok
    notifempty
    compress
    delaycompress
}

/tmp/hermes-browser-bridge.error.log {
    weekly
    rotate 4
    maxsize 10M
    copytruncate
    missingok
    notifempty
    compress
    delaycompress
}
